name: Validate and build project

on:
  pull_request:
  push:
    branches: 
      - "**"
      - "!master"
      - "!dev"

jobs:
  build-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in app.js server/*.js client/js/*.js; do
            node --check "$file"
          done

      - name: Downcase GITHUB_REPOSITORY and set as REPO (for docker image name)
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build Docker image
        run: docker build --file Dockerfile --tag ${{ env.REPO }}:${{ github.sha }} .
